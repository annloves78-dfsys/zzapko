<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>짭코 대전쟁</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="menu-screen" class="screen home-screen">

  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">짭코 기지</span>
      <span class="event-badge">던전 준비중</span>
    </div>
    <div class="topbar-right">
      <span class="point-label">POINT</span>
      <span class="point-value">0</span>
    </div>
  </div>

  <div class="subbar">
    <div class="currency-box">
      <span class="coin-icon">●</span>
      <span class="coin-value">0</span>
    </div>
    <button class="round-btn" disabled title="준비중">i</button>
    <button class="round-btn" disabled title="준비중">📅</button>
  </div>

  <div class="base-body">
    <div class="base-left">
      <button id="start-battle-btn" class="big-btn big-btn-primary">전투개시!!</button>
      <button class="big-btn" disabled>파워 업<span class="soon-badge">준비중</span></button>
      <button id="formation-btn" class="big-btn">캐릭터 편성</button>

      <div class="icon-row">
        <button class="icon-btn" disabled><span class="icon-glyph">📖</span>메뉴</button>
        <button class="icon-btn" disabled><span class="icon-glyph">🎩</span>가마토토</button>
        <button class="icon-btn" disabled><span class="icon-glyph">📜</span>미션</button>
      </div>
    </div>

    <div class="base-right">
      <div class="stage-dots">
        <button class="stage-dot" disabled></button>
        <button class="stage-dot" disabled></button>
      </div>
      <div class="speech-bubble">유닛을 소환해서 상대 기지를 부숴라!</div>
      <div class="mascot">
        <div class="mascot-face">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="mascot-mouth"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <button class="gacha-banner" disabled>뽑기 개최 중!!</button>
    <div class="bottombar-buttons">
      <button class="mini-btn" disabled>저장고</button>
      <button class="mini-btn" disabled>유닛 뽑기<span class="soon-badge">준비중</span></button>
      <button class="mini-btn" disabled>레어 뽑기<span class="soon-badge">준비중</span></button>
    </div>
    <button class="shop-btn" disabled>🛒 아이템 샵<span class="soon-badge">준비중</span></button>
    <div class="can-currency"><span>🥫</span><span>0</span></div>
  </div>

  <div id="battle-select-panel" class="battle-select-panel hidden">
    <div class="battle-select-box">
      <h2>전투 방식 선택</h2>
      <div class="menu-buttons">
        <button id="single-btn">1인용 시작</button>
        <button id="pvp-btn">1:1 대전 찾기</button>
      </div>
      <p id="queue-status" class="queue-status hidden">상대를 찾는 중...</p>
      <button id="battle-select-close" class="battle-select-close">닫기</button>
    </div>
  </div>

  <div id="formation-panel" class="battle-select-panel hidden">
    <div class="battle-select-box formation-box">
      <h2>캐릭터 편성</h2>
      <p class="formation-hint">전투에 들고 갈 유닛을 골라줘 (최소 1개)</p>
      <div id="formation-list" class="formation-list"></div>
      <p id="formation-error" class="formation-error hidden">최소 1개는 선택해야 해!</p>
      <div class="menu-buttons">
        <button id="formation-save-btn">저장</button>
        <button id="formation-close-btn" class="battle-select-close">닫기</button>
      </div>
    </div>
  </div>

</div>

<div id="battle-screen" class="screen hidden">
  <div class="hud">
    <div class="hp-box left">
      <div class="hp-label">내 기지</div>
      <div class="hp-bar-bg"><div id="left-hp-bar" class="hp-bar-fill left"></div></div>
    </div>
    <div class="money-box">
      <span id="money-value">0</span> 원
    </div>
    <div class="hp-box right">
      <div class="hp-label">적 기지</div>
      <div class="hp-bar-bg"><div id="right-hp-bar" class="hp-bar-fill right"></div></div>
    </div>
  </div>

  <div class="lane-wrap">
    <div id="lane" class="lane">
      <div class="base base-left"></div>
      <div class="base base-right"></div>
    </div>
  </div>

  <div id="unit-buttons" class="unit-buttons"></div>

  <button id="leave-btn" class="leave-btn">나가기</button>
</div>

<div id="gameover-overlay" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="gameover-title">승리!</h2>
    <button id="gameover-menu-btn">메뉴로</button>
  </div>
</div>

<script src="/zzapko/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
